services:
  # 1. 主数据库：PostgreSQL 16（阿里云镜像）
  postgres:
    image: registry.cn-hangzhou.aliyuncs.com/library/postgres:16-alpine
    container_name: stock_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: stock123456
      POSTGRES_DB: stock_data
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G

  # 2. 缓存：Redis 7.2（阿里云镜像）
  redis:
    image: registry.cn-hangzhou.aliyuncs.com/library/redis:7.2-alpine
    container_name: stock_cache
    command: redis-server --requirepass stock_redis_123
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  # 3. 本地AI引擎：Ollama（阿里云镜像）
  ollama:
    image: registry.cn-hangzhou.aliyuncs.com/ollama/ollama:latest
    container_name: stock_ai
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always
