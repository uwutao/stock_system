<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI股票筛选分析</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        .loading {display:none;}
        .show-loading {display:block;}
    </style>
</head>
<body class="container mt-4">
    <h2>🤖 AI 股票筛选面板</h2>
    <hr>
    <div class="row">
        <!-- 左侧筛选表单 -->
        <div class="col-md-4">
            <div class="card p-3">
                <h5>筛选参数</h5>
                <div class="mb-3">
                    <label class="form-label">最低股价</label>
                    <input type="number" id="min_price" class="form-control" value="0">
                </div>
                <div class="mb-3">
                    <label class="form-label">最高股价</label>
                    <input type="number" id="max_price" class="form-control" value="500">
                </div>
                <div class="mb-3">
                    <label class="form-label">最多返回标的数量</label>
                    <input type="number" id="max_count" class="form-control" value="20">
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" id="use_llm" class="form-check-input">
                    <label class="form-check-label">启用LLM生成分析理由（较慢）</label>
                </div>
                <button id="runFilterBtn" class="btn btn-primary w-100">开始AI筛选</button>
                <div class="mt-3 loading" id="loadingText">
                    <div class="spinner-border text-primary" role="status"></div>
                    <span>AI计算中，请稍候...</span>
                </div>
            </div>
        </div>

        <!-- 右侧结果表格 -->
        <div class="col-md-8">
            <div class="card p-3">
                <h5>筛选结果</h5>
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>代码</th>
                            <th>名称</th>
                            <th>价格</th>
                            <th>AI得分</th>
                            <th>行业</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="resultTableBody">
                        <tr>
                            <td colspan="6" class="text-center text-secondary">点击左侧【开始AI筛选】加载股票列表</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

<script>
document.getElementById("runFilterBtn").addEventListener("click", async function(){
    const btn = this;
    const loadingDom = document.getElementById("loadingText");
    const tableBody = document.getElementById("resultTableBody");

    // 读取表单参数
    const payload = {
        min_price: parseFloat(document.getElementById("min_price").value),
        max_price: parseFloat(document.getElementById("max_price").value),
        max_count: parseInt(document.getElementById("max_count").value),
        use_llm: document.getElementById("use_llm").checked
    };

    // 切换加载状态
    loadingDom.classList.add("show-loading");
    btn.disabled = true;
    tableBody.innerHTML = `<tr><td colspan="6" class="text-center">正在计算...</td></tr>`;

    try {
        const resp = await fetch("/api/run_filter", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)
        });
        const json = await resp.json();
        if(json.code !==0){
            tableBody.innerHTML = `<tr><td colspan="6" class="text-danger">查询失败</td></tr>`;
            return;
        }
        const dataList = json.data;
        if(dataList.length === 0){
            tableBody.innerHTML = `<tr><td colspan="6" class="text-center">没有符合条件标的</td></tr>`;
            return;
        }
        // 渲染表格
        let html = "";
        for(let item of dataList){
            html += `
            <tr>
                <td>${item.code}</td>
                <td>${item.name}</td>
                <td>${item.close}</td>
                <td><span class="badge bg-success">${item.ai_score}</span></td>
                <td>${item.industry || '-'}</td>
                <td>
                    <a href="/api/stock_detail/${item.code}" class="btn btn-sm btn-outline-primary">查看详情</a>
                </td>
            </tr>
            `
        }
        tableBody.innerHTML = html;
    }catch(err){
        tableBody.innerHTML = `<tr><td colspan="6" class="text-danger">网络请求异常</td></tr>`;
        console.error(err);
    }finally{
        loadingDom.classList.remove("show-loading");
        btn.disabled = false;
    }
})
</script>
</body>
</html>
